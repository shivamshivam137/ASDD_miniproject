{% extends "base.html" %}{% block title %}Districts{% endblock %}{% block content %}<div class=titlebar><div><h1>District Management</h1><p>Assign officers and manage district coverage.</p></div><button class="btn primary" onclick=openD()>＋ Add District</button></div><div class=cards id=r></div>{% endblock %}{% block scripts %}<script>let dd=[];async function load(){dd=await api('/api/districts');r.innerHTML=dd.map(x=>`<div class=card><div class=code>${x.code}</div><h3>${x.name}</h3><p>${x.state}</p><b>Officer:</b> ${x.officer||'Unassigned'}<br>${status(x.status)}<div><button class=link-btn onclick='openD(${x.id})'>Edit</button> <button class=danger onclick=delD(${x.id})>Delete</button></div></div>`).join('')}function openD(id){let x=id?dd.find(a=>a.id===id):{};modal(`<h2>${id?'Edit':'Add'} District</h2><form id=f class=form><label>District<input name=name value="${esc(x.name||'')}" required></label><label>Code<input name=code value="${esc(x.code||'')}" required></label><label>Officer<input name=officer value="${esc(x.officer||'')}"></label><label>Status<select name=status><option>Active</option><option>Inactive</option></select></label><button class="btn primary">Save</button></form>`);f.onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(f));if(id)await api('/api/districts/'+id,'PUT',d);else await api('/api/districts','POST',d);closeModal();load()}}async function delD(id){if(confirm('Delete district?')){await api('/api/districts/'+id,'DELETE');load()}}load()</script>{% endblock %}
