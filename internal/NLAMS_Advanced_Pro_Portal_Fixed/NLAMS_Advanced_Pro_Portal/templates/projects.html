{% extends "base.html" %}{% block title %}Project Monitoring{% endblock %}{% block content %}<div class=titlebar><div><h1>Project Monitoring</h1><p>End-to-end acquisition project control.</p></div><div><a class=btn href="/api/report.csv">↓ Export</a> <button class="btn primary" onclick="openP()">＋ New Project</button></div></div><div class=panel><div class=toolbar><input id=q placeholder="Search projects..." oninput=load()><select id=s onchange=load()><option value="">All Status</option><option>Draft</option><option>Submitted</option><option>In Progress</option><option>Approved</option><option>Pending</option><option>Completed</option></select></div><div class=table><table><thead><tr><th>ID</th><th>Project</th><th>District</th><th>Agency</th><th>Land</th><th>Progress</th><th>Status</th><th>Risk</th><th>Action</th></tr></thead><tbody id=r></tbody></table></div></div>{% endblock %}{% block scripts %}<script>let ps=[];async function load(){ps=await api('/api/projects?q='+encodeURIComponent(q.value)+'&status='+encodeURIComponent(s.value));r.innerHTML=ps.map(p=>`<tr><td>${p.project_id}</td><td><b>${p.name}</b><small>${p.description}</small></td><td>${p.district}</td><td>${p.agency}</td><td>${p.land_required} ${p.unit}</td><td><div class=bar><i style="width:${p.progress}%"></i></div>${p.progress}%</td><td>${status(p.status)}</td><td>${risk(p.risk)}</td><td><button class=link-btn onclick='openP(${p.id})'>Edit</button> <button class=danger onclick=delP(${p.id})>Delete</button></td></tr>`).join('')}function openP(id){let p=id?ps.find(x=>x.id===id):{};modal(`<h2>${id?'Edit':'Create'} Project</h2><form id=f class=form><label>Project Name<input name=name value="${esc(p.name||'')}" required></label><label>District<input name=district value="${esc(p.district||'Pune')}" required></label><label>Agency<input name=agency value="${esc(p.agency||'Maharashtra State Agency')}"></label><label>Land Required<input name=land_required type=number value="${p.land_required||0}"></label><label>Status<select name=status>${['Draft','Submitted','In Progress','Approved','Pending','Completed'].map(x=>`<option ${p.status===x?'selected':''}>${x}</option>`).join('')}</select></label><label>Progress %<input name=progress type=number min=0 max=100 value="${p.progress||0}"></label><label>Risk<select name=risk><option>Low</option><option ${p.risk==='Medium'?'selected':''}>Medium</option><option ${p.risk==='High'?'selected':''}>High</option></select></label><label>Description<textarea name=description>${esc(p.description||'')}</textarea></label><button class="btn primary">Save</button></form>`);f.onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(f));if(id)await api('/api/projects/'+id,'PUT',d);else await api('/api/projects','POST',d);closeModal();load()}}async function delP(id){if(confirm('Delete project?')){await api('/api/projects/'+id,'DELETE');load()}}load()</script>{% endblock %}
