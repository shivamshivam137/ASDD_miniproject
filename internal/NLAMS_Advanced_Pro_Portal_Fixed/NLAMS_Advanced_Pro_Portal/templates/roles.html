{% extends "base.html" %}{% block title %}Roles{% endblock %}{% block content %}<div class=titlebar><div><h1>Roles & Permissions</h1><p>Role based access control.</p></div><button class="btn primary" onclick=openR()>＋ Create Role</button></div><div class=cards id=r></div>{% endblock %}{% block scripts %}<script>let rr=[];async function load(){rr=await api('/api/roles');r.innerHTML=rr.map(x=>`<div class=card><h3>${x.name}</h3><p>${x.description}</p><div class=chips>${x.permissions.split(',').map(p=>`<span>${p}</span>`).join('')}</div><button class=link-btn onclick='openR(${x.id})'>Edit</button> <button class=danger onclick=delR(${x.id})>Delete</button></div>`).join('')}function openR(id){let x=id?rr.find(a=>a.id===id):{};modal(`<h2>${id?'Edit':'Create'} Role</h2><form id=f class=form><label>Name<input name=name value="${esc(x.name||'')}" required></label><label>Description<textarea name=description>${esc(x.description||'')}</textarea></label><label>Permissions<input name=permissions value="${esc(x.permissions||'')}"><small>Comma-separated: Dashboard,GIS,Risk,Projects...</small></label><button class="btn primary">Save</button></form>`);f.onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(f));d.permissions=d.permissions.split(',').map(x=>x.trim()).filter(Boolean);if(id)await api('/api/roles/'+id,'PUT',d);else await api('/api/roles','POST',d);closeModal();load()}}async function delR(id){if(confirm('Delete role?')){await api('/api/roles/'+id,'DELETE');load()}}load()</script>{% endblock %}
