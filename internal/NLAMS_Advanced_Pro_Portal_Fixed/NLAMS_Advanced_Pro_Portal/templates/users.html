{% extends "base.html" %}{% block title %}Users{% endblock %}{% block content %}<div class=titlebar><div><h1>User Management</h1><p>Accounts, roles, districts and access status.</p></div><button class="btn primary" onclick=openU()>＋ Add User</button></div><div class=panel><div class=toolbar><input id=q placeholder="Search users..." oninput=load()></div><div class=table><table><thead><tr><th>Name</th><th>Username</th><th>Email</th><th>Role</th><th>District</th><th>Status</th><th>Action</th></tr></thead><tbody id=r></tbody></table></div></div>{% endblock %}{% block scripts %}<script>let us=[];async function load(){us=await api('/api/users?q='+encodeURIComponent(q.value));r.innerHTML=us.map(u=>`<tr><td><b>${u.name}</b></td><td>${u.username}</td><td>${u.email}</td><td>${u.role}</td><td>${u.district}</td><td>${status(u.status)}</td><td><button class=link-btn onclick='openU(${u.id})'>Edit</button> <button class=danger onclick=delU(${u.id})>Delete</button></td></tr>`).join('')}function openU(id){let u=id?us.find(x=>x.id===id):{};modal(`<h2>${id?'Edit':'Add'} User</h2><form id=f class=form><label>Name<input name=name value="${esc(u.name||'')}" required></label><label>Username<input name=username value="${esc(u.username||'')}" ${id?'disabled':''} required></label><label>Email<input name=email value="${esc(u.email||'')}" required></label><label>Role<input name=role value="${esc(u.role||'Administrator')}"></label><label>District<input name=district value="${esc(u.district||'') }"></label><label>Status<select name=status><option>Active</option><option>Inactive</option></select></label><label>Password<input type=password name=password placeholder="Leave blank to keep current"></label><button class="btn primary">Save</button></form>`);f.onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(f));if(id){delete d.username;await api('/api/users/'+id,'PUT',d)}else await api('/api/users','POST',d);closeModal();load()}}async function delU(id){if(confirm('Delete user?')){await api('/api/users/'+id,'DELETE');load()}}load()</script>{% endblock %}
