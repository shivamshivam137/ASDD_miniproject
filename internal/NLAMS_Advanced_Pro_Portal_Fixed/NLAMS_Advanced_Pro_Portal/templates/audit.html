{% extends "base.html" %}{% block title %}Audit Logs{% endblock %}{% block content %}<div class=titlebar><div><h1>Audit Logs</h1><p>Traceable administrator and system actions.</p></div></div><div class=panel><div class=toolbar><input id=q placeholder="Search logs..." oninput=load()></div><div class=table><table><thead><tr><th>Date & Time</th><th>User</th><th>Action</th><th>Module</th><th>Details</th></tr></thead><tbody id=r></tbody></table></div></div>{% endblock %}{% block scripts %}<script>async function load(){let x=await api('/api/audit?q='+encodeURIComponent(q.value));r.innerHTML=x.map(a=>`<tr><td>${fmt(a.created_at)}</td><td>${a.user}</td><td>${a.action}</td><td>${a.module}</td><td>${a.details||''}</td></tr>`).join('')}load()</script>{% endblock %}
