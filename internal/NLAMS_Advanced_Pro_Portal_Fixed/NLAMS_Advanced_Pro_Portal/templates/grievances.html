{% extends "base.html" %}{% block title %}Grievances{% endblock %}{% block content %}<div class="titlebar"><div><h1>Grievance Management</h1><p>Track citizen issues, priority, assignment and resolution.</p></div><button class="btn primary" onclick="openG()">＋ Register Grievance</button></div><div class="panel"><div class=table><table><thead><tr><th>ID</th><th>Project</th><th>Category</th><th>Issue</th><th>Priority</th><th>Status</th><th>Assigned</th><th>Action</th></tr></thead><tbody id=rows></tbody></table></div></div>{% endblock %}{% block scripts %}<script>let gs=[];async function load(){gs=await api('/api/grievances');rows.innerHTML=gs.map(g=>`<tr><td>${g.grievance_id}</td><td>${g.project_id}</td><td>${g.category}</td><td>${g.description}</td><td>${risk(g.priority)}</td><td>${status(g.status)}</td><td>${g.assigned_to}</td><td><button class=link-btn onclick='openG(${g.id})'>Edit</button></td></tr>`).join('')}function openG(id){let g=id?gs.find(x=>x.id===id):{};modal(`<h2>${id?'Edit':'Register'} Grievance</h2><form id=f class=form><label>Project ID<input name=project_id value="${esc(g.project_id||'NLAMS-PUN-001')}" ${id?'disabled':''}></label><label>Category<input name=category value="${esc(g.category||'Compensation')}"></label><label>Description<textarea name=description>${esc(g.description||'')}</textarea></label><label>Priority<select name=priority><option>Low</option><option ${g.priority==='Medium'?'selected':''}>Medium</option><option ${g.priority==='High'?'selected':''}>High</option></select></label><label>Status<select name=status><option>Open</option><option>In Progress</option><option>Resolved</option></select></label><label>Assigned To<input name=assigned_to value="${esc(g.assigned_to||'Unassigned')}"></label><button class="btn primary">Save</button></form>`);f.onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(f));if(id){delete d.project_id;await api('/api/grievances/'+id,'PUT',d)}else await api('/api/grievances','POST',d);closeModal();load()}}load()</script>{% endblock %}
