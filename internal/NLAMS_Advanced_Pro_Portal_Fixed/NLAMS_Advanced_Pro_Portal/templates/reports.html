{% extends "base.html" %}{% block title %}Reports & Analytics{% endblock %}{% block content %}<div class="titlebar"><div><h1>Reports & Analytics</h1><p>Management intelligence and exportable acquisition data.</p></div><a class="btn primary" href="/api/report.csv">↓ Export Project Report</a></div><div class="cols"><section class="panel"><h3>Project Portfolio</h3><div id=portfolio class=report-bars></div></section><section class="panel"><h3>Key Indicators</h3><div id=kpi class=kpis></div></section></div><div class="panel"><h3>Trend Snapshot</h3><div class="bigtrend"><i style="height:25%"></i><i style="height:38%"></i><i style="height:34%"></i><i style="height:55%"></i><i style="height:62%"></i><i style="height:78%"></i><i style="height:70%"></i></div></div>{% endblock %}{% block scripts %}<script>async function load(){let d=await api('/api/dashboard');portfolio.innerHTML=d.statuses.map(x=>`<div><span>${x.status}</span><div class=bar><i style="width:${x.c/d.stats.projects*100}%"></i></div><b>${x.c}</b></div>`).join('');kpi.innerHTML=[['Projects',d.stats.projects],['Active Cases',d.stats.active],['Land',d.stats.land+' acres'],['Open Grievances',d.stats.grievances]].map(x=>`<div><small>${x[0]}</small><b>${x[1]}</b></div>`).join('')}load()</script>{% endblock %}
