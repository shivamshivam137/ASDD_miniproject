{% extends 'base.html' %}{% block title %}Eligibility Assessment{% endblock %}{% block content %}<section class=card><h2>Eligibility Queue</h2><table><tr><th>Family</th><th>Head</th><th>Village</th><th>Displaced</th><th>Current</th><th>Decision</th></tr>{% for f in families %}<tr><td>{{f.code}}</td><td>{{f.head}}</td><td>{{f.village}}</td><td>{{f.displacement}}</td><td><span class=status>{{f.eligibility}}</span></td><td><form class=compact method=post action='/eligibility/{{f.id}}'><select name=eligibility><option>Eligible</option><option>Under Review</option><option>Not Eligible</option></select><button>Save Decision</button></form></td></tr>{% endfor %}</table></section>{% endblock %}
