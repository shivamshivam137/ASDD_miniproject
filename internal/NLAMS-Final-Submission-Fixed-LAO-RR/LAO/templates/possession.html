{% extends 'base.html' %}{% block title %}Possession{% endblock %}{% block content %}<section class=card><h2>Possession Monitoring</h2><table><tr><th>Project</th><th>Required Area</th><th>Taken</th><th>Balance</th><th>Status</th><th>Update</th></tr>{% for r in rows %}<tr><td>{{r.code}}<br><small>{{r.name}}</small></td><td>{{r.required}} Ha</td><td>{{r.taken}} Ha</td><td>{{r.required-r.taken}} Ha</td><td><span class=status>{{r.status}}</span></td><td><form class=compact method=post action='/possession/{{r.id}}'><input type=number step=.01 name=taken value={{r.taken}}><select name=status><option>Pending</option><option>In Progress</option><option>Completed</option></select><button>Update</button></form></td></tr>{% endfor %}</table></section>{% endblock %}
