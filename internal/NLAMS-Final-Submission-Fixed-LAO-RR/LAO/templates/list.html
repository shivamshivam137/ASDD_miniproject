{% extends 'base.html' %}{% block title %}{{title}}{% endblock %}{% block content %}<section class=card><p class=muted>{{subtitle}}</p><table><tr><th>Project</th><th>Name</th><th>District</th><th>Area</th><th>Status</th><th>Risk</th><th>Review</th></tr>{% for p in projects %}<tr><td>{{p.code}}</td><td>{{p.name}}</td><td>{{p.district}}</td><td>{{p.area}} Ha</td><td><span class=status>{{p.status}}</span></td><td>{{p.risk}}%</td><td><a class=button href='/project/{{p.id}}'>Open Review</a></td></tr>{% endfor %}</table></section>{% endblock %}
