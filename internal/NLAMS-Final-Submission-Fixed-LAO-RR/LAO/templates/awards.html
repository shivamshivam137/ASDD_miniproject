{% extends 'base.html' %}{% block title %}Awards{% endblock %}{% block content %}<section class=card><h2>Award Register</h2><table><tr><th>Award No.</th><th>Project</th><th>Amount</th><th>Date</th><th>Status</th><th>Action</th></tr>{% for r in rows %}<tr><td>{{r.award_no}}</td><td>{{r.code}} — {{r.name}}</td><td>₹{{'{:,.0f}'.format(r.amount)}}</td><td>{{r.date}}</td><td><span class=status>{{r.status}}</span></td><td><a class=button href='/project/{{r.project_id}}'>Review Award</a></td></tr>{% endfor %}</table></section>{% endblock %}
