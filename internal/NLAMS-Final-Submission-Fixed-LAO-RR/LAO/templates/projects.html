{% extends 'base.html' %}{% block title %}Projects{% endblock %}{% block content %}<section class=card><form class=toolbar><input name=q value='{{q}}' placeholder='Search project, code or district'><button>Search</button><a class=button href='/projects'>Reset</a></form><table><tr><th>Project ID</th><th>Name</th><th>Agency</th><th>District</th><th>Area</th><th>Status</th><th>Action</th></tr>{% for p in projects %}<tr><td>{{p.code}}</td><td>{{p.name}}</td><td>{{p.agency}}</td><td>{{p.district}}</td><td>{{p.area}} Ha</td><td><span class=status>{{p.status}}</span></td><td><a class=button href='/project/{{p.id}}'>View / Review</a></td></tr>{% endfor %}</table></section>{% endblock %}
