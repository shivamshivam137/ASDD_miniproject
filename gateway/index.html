<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NLAMS Connected Portals</title><style>body{font-family:Arial;margin:0;background:#f4f7f9;color:#20384b}.wrap{max-width:1180px;margin:auto;padding:28px}.hero{background:#173b57;color:#fff;padding:25px;border-radius:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-top:18px}.card{background:#fff;border:1px solid #dfe7ec;border-radius:10px;padding:16px}.card h3{margin:0 0 7px}.card p{color:#71808c;font-size:13px;line-height:1.5}.btn{display:inline-block;padding:9px 12px;border-radius:7px;background:#2f6d9d;color:#fff;text-decoration:none;margin-top:7px}.flow{margin-top:20px}.event{padding:12px;border-left:4px solid #2f6d9d;background:#fff;margin:8px 0;border-radius:5px}.live{color:#2d875b;font-weight:700}</style></head><body><div class="wrap"><div class="hero"><h1>NLAMS — Connected Portal Gateway</h1><p>Existing role portals remain separate. This layer synchronizes workflow, approvals, audit events and field GPS evidence between them.</p><div id="health">Connecting to integration service…</div></div><div class="grid" id="portals"></div><section class="flow"><h2>Live Cross-Portal Workflow</h2><div id="workflow">Loading…</div></section></div><script>const roles=[['Landowner','landowner','http://127.0.0.1:5005'],['Grievance Officer','grievance_officer','http://127.0.0.1:5002'],['Land Acquisition Officer','lao','http://127.0.0.1:5004'],['Revenue Officer','revenue_officer','http://127.0.0.1:5006'],['Survey / GIS Officer','survey_gis_officer','http://127.0.0.1:5173'],['R&R Officer','rr_officer','http://127.0.0.1:5003'],['Project Agency','project_agency','http://127.0.0.1:5008'],['Administrator','administrator','http://127.0.0.1:5007']];portals.innerHTML=roles.map(x=>`<div class=card><h3>${x[0]}</h3><p>Role-specific portal with the existing UI/UX plus connected workflow inbox and shared NLAMS integration.</p><a class=btn href=${x[2]} target=_blank>Open Portal</a></div>`).join('');async function load(){try{let h=await (await fetch('http://127.0.0.1:8090/api/health')).json();health.innerHTML='<span class=live>● Integration service online</span> · '+h.time;let w=await (await fetch('http://127.0.0.1:8090/api/workflows')).json();workflow.innerHTML=w.map(x=>`<div class=event><b>${x.ref}</b> — ${x.title}<br><small>Status: ${x.status} · Current owner: ${x.current_role} · Updated: ${x.updated_at}</small></div>`).join('')||'No workflow items';}catch(e){health.textContent='Integration service offline — run START_ALL_NLAMS.bat';workflow.textContent='Start the integration service to view live cross-portal workflow.'}}load();setInterval(load,5000)</script></body></html>
